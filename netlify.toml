# The site is a pkgdown build of the package documentation. It is built and
# uploaded by .github/workflows/pkgdown.yaml rather than by Netlify, because
# building it needs R and the package's dependencies, several of which come
# from Bioconductor. Netlify serves the already-rendered directory.
#
# This file is copied into the published directory by that workflow, so the
# rules below apply to the deploy.

[build]
  publish = "docs"
  command = "echo 'Built by GitHub Actions; see .github/workflows/pkgdown.yaml'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# pkgdown writes content-addressed asset names, so they can be cached hard.
[[headers]]
  for = "/deps/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
