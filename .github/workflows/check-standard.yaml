# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macOS-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      # CRAN has begun publishing Zstandard-compressed macOS binaries that are
      # still named .tgz. pak's pkgdepends recognises gzip, bzip2 and xz only,
      # so installing one fails with "unknown archive type" during dependency
      # setup - before R CMD check even starts. Posit Package Manager serves
      # gzip builds of the same package versions, so point macOS at it.
      #
      # use-public-rspm above does not cover this: it only rewrites Linux
      # URLs, so macOS falls through to CRAN.
      #
      # PKG_CRAN_MIRROR is pak's own documented setting for this. An earlier
      # attempt set options(repos=) in ~/.Rprofile instead - pak's cran_mirror
      # does default to that option - but pak still fetched from CRAN, so the
      # profile evidently was not in effect for the process that resolved the
      # packages. The environment variable does not depend on R startup files
      # being loaded.
      #
      # Drop this step once pak can extract zstd archives. As of pak 0.11.1
      # and 0.11.1.9000 it cannot, so bumping pak-version is not a way out.
      - name: Use P3M binaries on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          P3M='https://packagemanager.posit.co/cran/latest'
          echo "PKG_CRAN_MIRROR=${P3M}" >> "$GITHUB_ENV"
          echo "PKG_CRAN_MIRROR set to ${P3M}"

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      # Diagnostic for the mirror problem above. Deliberately a single line:
      # only the tail of a job log is readable through the API, GitHub echoes
      # a step's whole script into the log, and the first version of this step
      # was verbose enough to push the actual pak error out of that window.
      #
      # setup-r-dependencies deletes .github/pkg.lock only after a successful
      # install, so on failure it still records where each package came from.
      - name: Show resolved package hosts (on failure)
        if: failure() && runner.os == 'macOS'
        shell: bash
        run: python3 -c "import collections,json,os,urllib.parse as u;f='.github/pkg.lock';p=json.load(open(f))['packages'] if os.path.exists(f) else [];print('PKG_CRAN_MIRROR='+os.environ.get('PKG_CRAN_MIRROR','<unset>'));print('hosts:',dict(collections.Counter(u.urlparse((x.get('sources') or [''])[0]).netloc for x in p)))"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
